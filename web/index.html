<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 Midterm Election Results · Live Dashboard</title>
    <meta name="description" content="Live 2026 midterm results: Senate, House and Governor races county by county, updated every minute. Open-source data pipeline with data-quality checks." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- 9. Share card (Open Graph / LinkedIn). og:image must be an absolute URL for LinkedIn:
         replace %SITE_URL% via VITE_SITE_URL at build time (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="2026 Midterm Election Results · Live Dashboard" />
    <meta property="og:description" content="Senate, House and Governor races county by county, updated every minute. Built on free data with a tested pipeline." />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
